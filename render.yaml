# Render.com blueprint: New + > Blueprint > point at this repo. Set GOOGLE_CLIENT_ID and ADMIN_EMAILS in the dashboard.
services:
  - type: web
    name: codepop
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: codepop-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: MARKER_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
